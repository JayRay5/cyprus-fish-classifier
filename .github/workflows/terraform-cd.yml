name: Terraform GitOps
#not use as I have free account on Azure.
on:
  workflow_dispatch:
#  push:
#    branches: [ "azure_migration" ]
#    paths:
#      - 'infrastructure/**' 
#  pull_request:
#    branches: [ "azure_migration" ]
#    paths:
#      - 'infrastructure/**'

permissions:
  contents: read
  id-token: write # for  OIDC authentification

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    defaults:
      run:
        working-directory: ./infrastructure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check # check si le code is well formated

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/azure_migration'
        run: terraform apply -auto-approve -input=false