name: Deploy Frontend to Hugging Face Spaces

on:
  push:
    branches: [ azure_migration ]
    paths:
      - 'apps/frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Git history

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_PRIVATE_SPACE }}
        run: |
          # 1. Enter the frontend directory
          cd apps/frontend
          
          # 2. Initialize an ephemeral Git sub-repository in this folder
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage and commit all frontend files (app.py, config.py, requirements.txt, assets...)
          git add .
          git commit -m "Prod deployment from GitHub Actions"
          
          # 4. Force push to the root of the Hugging Face Space
          git push --force https://JayRay5:$HF_TOKEN@huggingface.co/spaces/JayRay5/cyprus-fish-classifier-ui main